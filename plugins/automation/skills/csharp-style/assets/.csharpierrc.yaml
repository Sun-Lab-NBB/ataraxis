# CSharpier configuration for C# Unity projects
# Provides C# formatting similar to the clang-format style used in the C++ firmware projects.
#
# Installation:
#   dotnet tool install -g csharpier
#
# Usage:
#   csharpier .                    # Formats all files
#   csharpier --check .            # Reports formatting violations without writing (CI mode)
#   csharpier Assets/              # Formats a specific directory

printWidth: 120
useTabs: false
tabWidth: 4
endOfLine: lf
